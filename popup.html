<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContextBridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="5" cy="14" r="4" fill="#7c3aed" opacity="0.9"/>
          <circle cx="23" cy="14" r="4" fill="#06b6d4" opacity="0.9"/>
          <path d="M9 14 C 14 6, 14 6, 19 14" stroke="url(#bridge-grad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M9 14 C 14 22, 14 22, 19 14" stroke="url(#bridge-grad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.3"/>
          <defs>
            <linearGradient id="bridge-grad" x1="9" y1="14" x2="19" y2="14">
              <stop offset="0%" stop-color="#7c3aed"/>
              <stop offset="100%" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div>
        <h1 class="header-title">ContextBridge</h1>
        <p class="header-tagline">Switch AI without starting over</p>
      </div>
    </div>
  </header>

  <!-- Platform Status -->
  <div class="platform-status" id="platform-status">
    <div class="status-dot" id="status-dot"></div>
    <span id="platform-label">Detecting platform...</span>
  </div>

  <!-- Capture Button -->
  <button class="capture-btn" id="capture-btn" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    <span id="capture-btn-text">Capture This Conversation</span>
  </button>

  <!-- Sessions List -->
  <div class="sessions-section">
    <div class="sessions-header">
      <h2 class="sessions-title">Recent Sessions</h2>
      <span class="sessions-count" id="sessions-count">0</span>
    </div>
    <div class="sessions-list" id="sessions-list">
      <div class="empty-state" id="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
        </svg>
        <p>No captured sessions yet</p>
        <p class="empty-hint">Visit an AI platform and click capture</p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <a href="http://localhost:3000" target="_blank" class="dashboard-link" id="dashboard-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
      </svg>
      Open Dashboard
    </a>
    <span class="version">v1.0.0</span>
  </footer>

  <!-- Resume Prompt Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Resume Prompt</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <pre class="prompt-display" id="prompt-display"></pre>
      <div class="modal-actions">
        <button class="btn-copy" id="btn-copy">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Copy to Clipboard
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
